general {
    grace = 0
    hide_cursor = true
}

background {
    monitor =
    path = /home/rafeu/Imagens/1Corintios(sombra).png
    blur_passes = 2
    blur_size = 4
    noise = 0.02
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(3F68EEff)
    inner_color = rgba(181a1fee)
    font_color = rgb(D6EBFF)
    fade_on_empty = true
    placeholder_text = <span foreground="##5c6370">Digite a senha...</span>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(D6EBFFee)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d de %B")"
    color = rgba(A3D5FFcc)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(00BFFFcc)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}
